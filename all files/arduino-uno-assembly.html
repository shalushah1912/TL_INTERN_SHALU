<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Arduino Uno R3 — Interactive Assembly</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #020810;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    font-family: 'Share Tech Mono', monospace;
  }
  .wrap {
    background: #060d1a;
    border-radius: 20px;
    padding: 28px 24px 32px;
    width: 100%;
    max-width: 800px;
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(0,200,255,0.15);
    box-shadow: 0 0 60px rgba(0,100,200,0.15), inset 0 0 40px rgba(0,10,30,0.8);
  }
  .wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(0deg, rgba(0,200,255,0.018) 0px, rgba(0,200,255,0.018) 1px, transparent 1px, transparent 40px),
      repeating-linear-gradient(90deg, rgba(0,200,255,0.018) 0px, rgba(0,200,255,0.018) 1px, transparent 1px, transparent 40px);
    pointer-events: none;
    border-radius: 20px;
  }
  .hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .title { font-family: 'Orbitron', monospace; font-size: 15px; font-weight: 700; color: #00ffaa; letter-spacing: 3px; text-transform: uppercase; }
  .status-bar { font-size: 11px; color: #00ffaa; opacity: 0.55; letter-spacing: 1px; }
  .stage { position: relative; width: 100%; height: 400px; margin-bottom: 22px; }
  .part {
    position: absolute;
    cursor: pointer;
    transition: transform 0.75s cubic-bezier(.34,1.4,.64,1), opacity 0.5s ease, filter 0.2s;
    opacity: 0;
    transform: translateX(var(--ox)) translateY(var(--oy)) scale(0.6);
    filter: drop-shadow(0 0 6px rgba(0,255,150,0.35));
  }
  .part.arrived { opacity: 1; transform: translateX(0) translateY(0) scale(1); }
  .part:hover {
    filter: drop-shadow(0 0 18px rgba(0,255,160,0.95)) brightness(1.3) !important;
    transform: translateX(0) translateY(0) scale(1.06) !important;
    z-index: 20;
  }
  .part svg { display: block; }
  .controls { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .btn-assemble {
    font-family: 'Orbitron', monospace; font-size: 12px; font-weight: 700;
    letter-spacing: 2px; color: #00ffaa; background: transparent;
    border: 1.5px solid #00ffaa; border-radius: 8px; padding: 11px 24px;
    cursor: pointer; transition: background 0.2s, box-shadow 0.2s;
    text-transform: uppercase;
  }
  .btn-assemble:hover { background: rgba(0,255,170,0.1); box-shadow: 0 0 20px rgba(0,255,150,0.3); }
  .btn-assemble:active { background: rgba(0,255,170,0.22); transform: scale(0.98); }
  .btn-reset {
    font-family: 'Orbitron', monospace; font-size: 11px; letter-spacing: 1px;
    color: rgba(0,255,170,0.45); background: transparent;
    border: 1px solid rgba(0,255,170,0.22); border-radius: 8px; padding: 11px 18px;
    cursor: pointer; transition: all 0.2s; text-transform: uppercase;
  }
  .btn-reset:hover { color: #00ffaa; border-color: rgba(0,255,170,0.6); box-shadow: 0 0 12px rgba(0,255,150,0.15); }
  .progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .progress-label { font-size: 11px; color: rgba(0,255,170,0.45); letter-spacing: 1px; }
  .progress-track { flex: 1; height: 3px; background: rgba(0,255,170,0.1); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #007744, #00ffaa); border-radius: 2px; width: 0%; transition: width 0.4s ease; }
  .progress-pct { font-size: 11px; color: #00ffaa; min-width: 40px; text-align: right; }
  .info-panel {
    background: rgba(0,15,10,0.95); border: 1px solid rgba(0,255,170,0.25);
    border-radius: 12px; padding: 18px 20px; min-height: 90px;
    transition: all 0.3s; margin-bottom: 14px;
  }
  .info-panel .part-name { font-family: 'Orbitron', monospace; font-size: 13px; color: #00ffaa; letter-spacing: 2px; margin-bottom: 8px; }
  .info-panel .part-desc { font-size: 12px; color: rgba(180,255,220,0.75); line-height: 1.75; }
  .info-panel .part-stats { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .stat-chip { font-size: 10px; color: rgba(0,255,170,0.7); background: rgba(0,255,170,0.06); border: 1px solid rgba(0,255,170,0.18); border-radius: 4px; padding: 4px 10px; letter-spacing: 1px; }
  .part-list { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .part-dot { width: 11px; height: 11px; border-radius: 50%; background: rgba(0,255,170,0.08); border: 1px solid rgba(0,255,170,0.22); transition: all 0.3s; cursor: default; }
  .part-dot.done { background: #00ffaa; border-color: #00ffaa; box-shadow: 0 0 6px rgba(0,255,170,0.55); }
  .hint { font-size: 11px; color: rgba(0,255,170,0.28); letter-spacing: 1px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="title">Arduino Uno R3 — Assembly</div>
    <div class="status-bar" id="status">AWAITING ASSEMBLY</div>
  </div>
  <div class="controls">
    <button class="btn-assemble" onclick="assemble()">⚡ Assemble Arduino</button>
    <button class="btn-reset" onclick="reset()">↺ Reset</button>
  </div>
  <div class="progress-row">
    <span class="progress-label">BUILD</span>
    <div class="progress-track"><div class="progress-fill" id="prog"></div></div>
    <span class="progress-pct" id="progPct">0%</span>
  </div>
  <div class="stage" id="stage"></div>
  <div class="info-panel">
    <div class="part-name" id="infoName">— SELECT A PART —</div>
    <div class="part-desc" id="infoDesc">Assemble the board first, then click any glowing part to learn about it.</div>
    <div class="part-stats" id="infoStats"></div>
  </div>
  <div class="part-list" id="partDots"></div>
  <div class="hint" id="hint">▶ Click ASSEMBLE to begin</div>
</div>

<script>
/* ─────────────────────────────────────────────────────────
   Arduino Uno R3 layout  (stage 760 × 400)
   Board sits centred roughly x:80–680, y:30–370
   ───────────────────────────────────────────────────────── */
const parts = [

  /* 1 ── PCB */
  {
    id:'pcb', name:'PCB Board',
    ox:'0px', oy:'320px', x:78, y:28, w:604, h:344, delay:0,
    desc:'The Arduino Uno R3 PCB is a two-layer FR4 fibreglass board with its signature sky-blue soldermask. Copper traces on both layers interconnect every component. The irregular notch on the upper-left corner is a deliberate shape to make orientation obvious and to match Arduino-compatible shields.',
    stats:['Material: FR4','Layers: 2','Size: 68.6 × 53.4 mm','Colour: Blue soldermask'],
    svg:`<svg width="604" height="344" viewBox="0 0 604 344">
      <!-- main PCB body — Arduino-shaped with upper-left notch -->
      <path d="M40,2 L602,2 L602,342 L2,342 L2,60 L40,60 Z" fill="#0a1e3a" stroke="#1a5aaa" stroke-width="2" rx="6"/>
      <!-- soldermask texture lines -->
      ${[...Array(9)].map((_,i)=>`<line x1="10" y1="${42+i*34}" x2="594" y2="${42+i*34}" stroke="rgba(30,120,220,0.07)" stroke-width="0.8"/>`).join('')}
      ${[...Array(17)].map((_,i)=>`<line x1="${10+i*36}" y1="2" x2="${10+i*36}" y2="342" stroke="rgba(30,120,220,0.07)" stroke-width="0.8"/>`).join('')}
      <!-- mounting holes -->
      <circle cx="22" cy="22" r="5" fill="none" stroke="rgba(0,200,255,0.3)" stroke-width="1.2"/>
      <circle cx="582" cy="22" r="5" fill="none" stroke="rgba(0,200,255,0.3)" stroke-width="1.2"/>
      <circle cx="22" cy="322" r="5" fill="none" stroke="rgba(0,200,255,0.3)" stroke-width="1.2"/>
      <circle cx="582" cy="322" r="5" fill="none" stroke="rgba(0,200,255,0.3)" stroke-width="1.2"/>
      <!-- silkscreen label -->
      <text x="302" y="332" fill="rgba(100,180,255,0.3)" font-size="10" text-anchor="middle" font-family="'Share Tech Mono',monospace">ARDUINO UNO  R3</text>
      <text x="302" y="318" fill="rgba(100,180,255,0.18)" font-size="8" text-anchor="middle" font-family="'Share Tech Mono',monospace">MADE IN ITALY</text>
    </svg>`
  },

  /* 2 ── ATmega328P (DIP-28) */
  {
    id:'mcu', name:'ATmega328P Microcontroller',
    ox:'0px', oy:'-280px', x:272, y:110, w:140, h:188, delay:250,
    desc:'The ATmega328P is the 8-bit AVR microcontroller that is the brain of the Arduino Uno. It runs at 16MHz, has 32KB of Flash program memory, 2KB of SRAM for variables, and 1KB of EEPROM for non-volatile storage. It executes your Arduino sketches and controls all the I/O pins.',
    stats:['CPU: AVR 8-bit 16MHz','Flash: 32KB','SRAM: 2KB','EEPROM: 1KB','Package: DIP-28'],
    svg:`<svg width="140" height="188" viewBox="0 0 140 188">
      <!-- IC body -->
      <rect x="14" y="4" width="112" height="180" rx="4" fill="#1a1a1a" stroke="#555" stroke-width="1.5"/>
      <!-- notch top -->
      <path d="M56,4 A14,14 0 0,0 84,4" fill="#111" stroke="#555" stroke-width="1"/>
      <!-- left pins 1-14 -->
      ${[...Array(14)].map((_,i)=>`
        <rect x="0" y="${14+i*11}" width="16" height="6" rx="1" fill="#888" stroke="#aaa" stroke-width="0.5"/>
        <line x1="16" y1="${17+i*11}" x2="14" y2="${17+i*11}" stroke="#666" stroke-width="0.5"/>
      `).join('')}
      <!-- right pins 15-28 -->
      ${[...Array(14)].map((_,i)=>`
        <rect x="124" y="${14+(13-i)*11}" width="16" height="6" rx="1" fill="#888" stroke="#aaa" stroke-width="0.5"/>
      `).join('')}
      <!-- chip text -->
      <text x="70" y="78" fill="rgba(220,220,220,0.85)" font-size="9" text-anchor="middle" font-family="'Share Tech Mono',monospace">ATmega328P</text>
      <text x="70" y="92" fill="rgba(180,180,180,0.6)" font-size="8" text-anchor="middle" font-family="'Share Tech Mono',monospace">ATMEL</text>
      <text x="70" y="106" fill="rgba(150,150,150,0.5)" font-size="7" text-anchor="middle" font-family="'Share Tech Mono',monospace">AVR  16MHz</text>
      <!-- dot marker -->
      <circle cx="22" cy="14" r="3" fill="#555"/>
    </svg>`
  },

  /* 3 ── ATmega16U2 USB-to-serial */
  {
    id:'usb_ic', name:'ATmega16U2 USB-Serial Bridge',
    ox:'-300px', oy:'0px', x:96, y:148, w:72, h:56, delay:500,
    desc:'The ATmega16U2 is a second microcontroller that acts as the USB-to-serial converter. It translates USB data from your computer into UART serial signals the ATmega328P understands, enabling sketch uploading and Serial Monitor communication without a separate FTDI chip.',
    stats:['IC: ATmega16U2','Interface: USB 2.0 FS','Baud: up to 115200','Package: QFN-32'],
    svg:`<svg width="72" height="56" viewBox="0 0 72 56">
      <rect x="2" y="2" width="68" height="52" rx="3" fill="#1a1a1a" stroke="#666" stroke-width="1.2"/>
      <!-- pins top -->
      ${[...Array(5)].map((_,i)=>`<rect x="${8+i*12}" y="0" width="6" height="4" rx="1" fill="#777" stroke="#999" stroke-width="0.4"/>`).join('')}
      <!-- pins bottom -->
      ${[...Array(5)].map((_,i)=>`<rect x="${8+i*12}" y="52" width="6" height="4" rx="1" fill="#777" stroke="#999" stroke-width="0.4"/>`).join('')}
      <!-- pins left -->
      ${[...Array(3)].map((_,i)=>`<rect x="0" y="${10+i*14}" width="4" height="6" rx="1" fill="#777" stroke="#999" stroke-width="0.4"/>`).join('')}
      <!-- pins right -->
      ${[...Array(3)].map((_,i)=>`<rect x="68" y="${10+i*14}" width="4" height="6" rx="1" fill="#777" stroke="#999" stroke-width="0.4"/>`).join('')}
      <circle cx="8" cy="8" r="2.5" fill="#555"/>
      <text x="36" y="28" fill="rgba(200,200,200,0.75)" font-size="7.5" text-anchor="middle" font-family="'Share Tech Mono',monospace">ATmega</text>
      <text x="36" y="38" fill="rgba(200,200,200,0.75)" font-size="7.5" text-anchor="middle" font-family="'Share Tech Mono',monospace">16U2</text>
    </svg>`
  },

  /* 4 ── USB-B port */
  {
    id:'usb_port', name:'USB Type-B Port',
    ox:'-320px', oy:'0px', x:82, y:82, w:52, h:56, delay:750,
    desc:'The USB Type-B socket connects the Arduino to a computer for power and programming. Unlike a typical Micro-USB, this square-shaped connector is more durable and the same type used on printers. It supplies up to 500mA at 5V and carries the serial data for sketch uploads.',
    stats:['Type: USB-B female','Power: 5V / 500mA','Data: USB 2.0 FS','Cable: USB-A to B'],
    svg:`<svg width="52" height="56" viewBox="0 0 52 56">
      <rect x="2" y="2" width="48" height="52" rx="4" fill="#222" stroke="#777" stroke-width="1.5"/>
      <!-- USB-B inner shape -->
      <path d="M10,10 L42,10 L42,36 L32,46 L20,46 L10,36 Z" fill="#111" stroke="#555" stroke-width="1"/>
      <!-- 4 internal pins -->
      <rect x="14" y="14" width="5" height="12" rx="1" fill="#aaa"/>
      <rect x="22" y="14" width="5" height="12" rx="1" fill="#aaa"/>
      <rect x="30" y="14" width="5" height="12" rx="1" fill="#aaa"/>
      <!-- mounting tabs -->
      <rect x="0" y="6" width="4" height="8" rx="1" fill="#1a1a1a" stroke="#666" stroke-width="0.8"/>
      <rect x="48" y="6" width="4" height="8" rx="1" fill="#1a1a1a" stroke="#666" stroke-width="0.8"/>
      <rect x="0" y="42" width="4" height="8" rx="1" fill="#1a1a1a" stroke="#666" stroke-width="0.8"/>
      <rect x="48" y="42" width="4" height="8" rx="1" fill="#1a1a1a" stroke="#666" stroke-width="0.8"/>
    </svg>`
  },

  /* 5 ── DC barrel jack */
  {
    id:'barrel', name:'DC Power Barrel Jack (7–12V)',
    ox:'-300px', oy:'300px', x:82, y:236, w:54, h:46, delay:1000,
    desc:'The 5.5mm/2.1mm barrel jack accepts an external DC power supply between 7V and 12V. An onboard M7 diode provides reverse-polarity protection. This is the preferred power input when the Arduino is used standalone away from a computer, powering motors or other high-current peripherals.',
    stats:['Input: 7–12V DC','Centre: Positive','Protection: M7 diode','Recommended: 9V'],
    svg:`<svg width="54" height="46" viewBox="0 0 54 46">
      <rect x="2" y="6" width="50" height="34" rx="5" fill="#333" stroke="#666" stroke-width="1.5"/>
      <!-- barrel hole -->
      <circle cx="27" cy="23" r="12" fill="#111" stroke="#555" stroke-width="1"/>
      <circle cx="27" cy="23" r="7" fill="#0a0a0a" stroke="#444" stroke-width="0.8"/>
      <circle cx="27" cy="23" r="3" fill="#222" stroke="#777" stroke-width="0.5"/>
      <!-- solder tabs -->
      <rect x="6" y="0" width="8" height="6" rx="1" fill="#1a1a1a" stroke="#666" stroke-width="0.8"/>
      <rect x="40" y="0" width="8" height="6" rx="1" fill="#1a1a1a" stroke="#666" stroke-width="0.8"/>
      <rect x="6" y="40" width="8" height="6" rx="1" fill="#1a1a1a" stroke="#666" stroke-width="0.8"/>
      <rect x="40" y="40" width="8" height="6" rx="1" fill="#1a1a1a" stroke="#666" stroke-width="0.8"/>
    </svg>`
  },

  /* 6 ── 5V regulator */
  {
    id:'vreg5', name:'5V Voltage Regulator (NCP1117)',
    ox:'300px', oy:'300px', x:152, y:276, w:52, h:38, delay:1200,
    desc:'The NCP1117-5.0 or LM7805 linear voltage regulator converts the raw 7–12V barrel jack input down to a clean, regulated 5V to power the ATmega328P and digital I/O pins. It can source up to 1A. The large metal tab is soldered to the PCB copper pour for heat dissipation.',
    stats:['IC: NCP1117 / LM7805','Output: 5.0V regulated','Max current: 1A','Package: TO-252 (SMD)'],
    svg:`<svg width="52" height="38" viewBox="0 0 52 38">
      <!-- TO-252 body -->
      <rect x="4" y="2" width="44" height="26" rx="3" fill="#1a1a10" stroke="#aa8800" stroke-width="1.2"/>
      <!-- metal tab -->
      <rect x="0" y="14" width="52" height="8" rx="2" fill="#2a2a18" stroke="#ccaa00" stroke-width="0.8"/>
      <!-- 3 pins -->
      <rect x="8" y="28" width="8" height="10" rx="1" fill="#887722" stroke="#ccaa00" stroke-width="0.8"/>
      <rect x="22" y="28" width="8" height="10" rx="1" fill="#887722" stroke="#ccaa00" stroke-width="0.8"/>
      <rect x="36" y="28" width="8" height="10" rx="1" fill="#887722" stroke="#ccaa00" stroke-width="0.8"/>
      <text x="26" y="16" fill="rgba(200,160,0,0.8)" font-size="7" text-anchor="middle" font-family="'Share Tech Mono',monospace">NCP1117-5V</text>
    </svg>`
  },

  /* 7 ── 3.3V regulator */
  {
    id:'vreg33', name:'3.3V Voltage Regulator (LP2985)',
    ox:'300px', oy:'-300px', x:206, y:276, w:38, h:32, delay:1250,
    desc:'The LP2985 is a 150mA LDO linear regulator that produces 3.3V from the 5V rail. It powers the 3.3V pin on the power header, which can supply sensors, Bluetooth modules, or SD card readers that require 3.3V logic. Note the 150mA limit — do not exceed it.',
    stats:['IC: LP2985','Output: 3.3V','Max current: 150mA','Input: from 5V rail'],
    svg:`<svg width="38" height="32" viewBox="0 0 38 32">
      <rect x="2" y="2" width="34" height="20" rx="3" fill="#1a1a10" stroke="#886600" stroke-width="1.1"/>
      <rect x="5" y="22" width="8" height="10" rx="1" fill="#665500" stroke="#aa8800" stroke-width="0.7"/>
      <rect x="15" y="22" width="8" height="10" rx="1" fill="#665500" stroke="#aa8800" stroke-width="0.7"/>
      <rect x="25" y="22" width="8" height="10" rx="1" fill="#665500" stroke="#aa8800" stroke-width="0.7"/>
      <text x="19" y="15" fill="rgba(180,130,0,0.75)" font-size="6.5" text-anchor="middle" font-family="'Share Tech Mono',monospace">LP2985</text>
    </svg>`
  },

  /* 8 ── Crystal 16MHz */
  {
    id:'crystal', name:'16MHz Crystal Oscillator',
    ox:'0px', oy:'300px', x:260, y:272, w:48, h:24, delay:1450,
    desc:'The silver HC-49 quartz crystal resonates at exactly 16MHz, providing the ATmega328P with its precise clock signal. Every instruction the microcontroller executes is timed by this crystal. The Arduino runs at 16MHz giving it around 16 million operations per second.',
    stats:['Frequency: 16MHz','Tolerance: ±20ppm','Package: HC-49/S SMD','Load cap: 22pF'],
    svg:`<svg width="48" height="24" viewBox="0 0 48 24">
      <!-- silver metal can -->
      <rect x="4" y="2" width="40" height="20" rx="6" fill="#b0b0b0" stroke="#888" stroke-width="1.2"/>
      <rect x="8" y="5" width="32" height="14" rx="4" fill="#cccccc" stroke="#aaa" stroke-width="0.5"/>
      <!-- seam line -->
      <line x1="4" y1="12" x2="44" y2="12" stroke="rgba(100,100,100,0.4)" stroke-width="0.5"/>
      <!-- pins -->
      <rect x="0" y="9" width="5" height="6" rx="1" fill="#999" stroke="#777" stroke-width="0.5"/>
      <rect x="43" y="9" width="5" height="6" rx="1" fill="#999" stroke="#777" stroke-width="0.5"/>
      <text x="24" y="15" fill="rgba(60,60,60,0.7)" font-size="6" text-anchor="middle" font-family="'Share Tech Mono',monospace">16.000</text>
    </svg>`
  },

  /* 9 ── Reset button */
  {
    id:'reset', name:'Reset Button',
    ox:'0px', oy:'-300px', x:506, y:82, w:34, h:34, delay:1650,
    desc:'The reset button is connected to the ATmega328P RESET pin. Pressing it pulls RESET LOW, which immediately restarts the board and runs the uploaded sketch from the beginning. It is also used in combination with the bootloader timing to trigger a firmware upload window.',
    stats:['Function: Hardware reset','Type: Tactile SMD','Active: LOW (pulls to GND)','Debounce: 100nF cap'],
    svg:`<svg width="34" height="34" viewBox="0 0 34 34">
      <rect x="2" y="2" width="30" height="30" rx="4" fill="#180a0a" stroke="#cc2200" stroke-width="1.5"/>
      <rect x="6" y="6" width="22" height="22" rx="3" fill="#dd3300" stroke="#ff4422" stroke-width="1"/>
      <circle cx="17" cy="17" r="6" fill="#ff5533" stroke="#ff7755" stroke-width="0.8"/>
      <circle cx="14" cy="14" r="2" fill="rgba(255,200,180,0.35)"/>
    </svg>`
  },

  /* 10 ── ICSP header (main MCU) */
  {
    id:'icsp', name:'ICSP Header (ATmega328P)',
    ox:'300px', oy:'0px', x:418, y:144, w:36, h:28, delay:1800,
    desc:'The In-Circuit Serial Programming (ICSP) header provides direct SPI access to the ATmega328P\'s bootloader. It is used with an external ISP programmer (like USBtiny or AVR-ISP mkII) to burn a new bootloader or to upload sketches without the USB-serial chip. Pinout: MISO, MOSI, SCK, RESET, VCC, GND.',
    stats:['Pins: 6 (2×3)','Protocol: SPI','Pitch: 2.54mm','Use: Bootloader burning'],
    svg:`<svg width="36" height="28" viewBox="0 0 36 28">
      <rect x="1" y="1" width="34" height="26" rx="3" fill="#0a1a0a" stroke="#1a8a1a" stroke-width="1"/>
      ${[0,1,2].map(i=>`
        <circle cx="${7+i*11}" cy="8" r="3.5" fill="#1a4a1a" stroke="rgba(0,200,100,0.5)" stroke-width="0.6"/>
        <circle cx="${7+i*11}" cy="8" r="1.5" fill="rgba(0,255,100,0.25)"/>
        <circle cx="${7+i*11}" cy="20" r="3.5" fill="#1a4a1a" stroke="rgba(0,200,100,0.5)" stroke-width="0.6"/>
        <circle cx="${7+i*11}" cy="20" r="1.5" fill="rgba(0,255,100,0.25)"/>
      `).join('')}
    </svg>`
  },

  /* 11 ── ICSP2 header (ATmega16U2) */
  {
    id:'icsp2', name:'ICSP Header (ATmega16U2)',

let assembled = false, arrivedCount = 0;

function buildStage() {
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  parts.forEach(p => {
    const div = document.createElement('div');
    div.className = 'part';
    div.id = 'part-' + p.id;
    div.style.cssText = `left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px;--ox:${p.ox};--oy:${p.oy};`;
    div.innerHTML = p.svg;
    div.addEventListener('click', () => showInfo(p));
    stage.appendChild(div);
  });
  buildDots();
}

function buildDots() {
  document.getElementById('partDots').innerHTML = parts.map(p =>
    `<div class="part-dot" id="dot-${p.id}" title="${p.name}"></div>`
  ).join('');
}

function assemble() {
  if (assembled) return;
  assembled = true;
  arrivedCount = 0;
  document.getElementById('status').textContent = 'ASSEMBLING...';
  document.getElementById('hint').textContent = '▶ Click any glowing part to inspect it';
  parts.forEach(p => {
    setTimeout(() => {
      document.getElementById('part-' + p.id).classList.add('arrived');
      arrivedCount++;
      const pct = Math.round((arrivedCount / parts.length) * 100);
      document.getElementById('prog').style.width = pct + '%';
      document.getElementById('progPct').textContent = pct + '%';
      document.getElementById('dot-' + p.id).classList.add('done');
      if (arrivedCount === parts.length) {
        document.getElementById('status').textContent = 'UNO ASSEMBLED — CLICK PARTS';
      }
    }, p.delay);
  });
}

function reset() {
  assembled = false;
  arrivedCount = 0;
  document.getElementById('prog').style.width = '0%';
  document.getElementById('progPct').textContent = '0%';
  document.getElementById('status').textContent = 'AWAITING ASSEMBLY';
  document.getElementById('hint').textContent = '▶ Click ASSEMBLE to begin';
  document.getElementById('infoName').textContent = '— SELECT A PART —';
  document.getElementById('infoDesc').textContent = 'Assemble the board first, then click any glowing part to learn about it.';
  document.getElementById('infoStats').innerHTML = '';
  buildStage();
}

function showInfo(p) {
  if (!assembled) return;
  document.getElementById('infoName').textContent = p.name.toUpperCase();
  document.getElementById('infoDesc').textContent = p.desc;
  document.getElementById('infoStats').innerHTML = p.stats.map(s => `<span class="stat-chip">${s}</span>`).join('');
  document.querySelectorAll('.part').forEach(el => el.style.filter = 'drop-shadow(0 0 4px rgba(0,255,150,0.1)) brightness(0.5)');
  document.getElementById('part-' + p.id).style.filter = 'drop-shadow(0 0 22px rgba(0,255,160,1)) brightness(1.5)';
}

buildStage();
</script>
