
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }

.proc-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
.proc-btn {
  padding: 14px 8px; border: 1.5px solid var(--color-border-secondary);
  border-radius: var(--border-radius-lg); background: transparent;
  cursor: pointer; transition: all 0.2s; text-align: center;
  font-family: var(--font-sans);
}
.proc-btn .btn-icon { font-size: 22px; margin-bottom: 4px; display: block; }
.proc-btn .btn-title { font-size: 13px; font-weight: 500; color: var(--color-text-primary); display: block; }
.proc-btn .btn-sub { font-size: 11px; color: var(--color-text-secondary); display: block; margin-top: 2px; }
.proc-btn:hover { background: var(--color-background-secondary); }
.proc-btn.active { border-width: 2px; }

.panel { display: none; }
.panel.visible { display: block; }

.panel-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 16px; }
.panel-badge { width: 48px; height: 48px; border-radius: var(--border-radius-md); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.panel-title { font-size: 18px; font-weight: 500; color: var(--color-text-primary); }
.panel-tagline { font-size: 13px; color: var(--color-text-secondary); margin-top: 3px; }

.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.tag { font-size: 11px; padding: 3px 10px; border-radius: 999px; font-weight: 500; }

.svg-area { border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); overflow: hidden; background: var(--color-background-secondary); margin-bottom: 14px; }

.desc-text { font-size: 13px; color: var(--color-text-secondary); line-height: 1.65; margin-bottom: 14px; }

.specs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.spec-card { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 10px 12px; }
.spec-card .sc-label { font-size: 11px; color: var(--color-text-secondary); margin-bottom: 3px; }
.spec-card .sc-val { font-size: 13px; font-weight: 500; color: var(--color-text-primary); }

@keyframes flyIn {
  from { opacity: 0; transform: translate(var(--tx,0px), var(--ty,-40px)) scale(0.7); }
  to   { opacity: 1; transform: translate(0,0) scale(1); }
}
@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
.part { animation: flyIn 0.45s cubic-bezier(0.34,1.4,0.64,1) both; }
.fadein { animation: fadeSlide 0.4s ease both; }
</style>

<h2 class="sr-only">Processor type comparison — CPU, GPU, TPU, NPU — with animated assembly diagrams and full specs</h2>

<div class="proc-btns" id="btnRow"></div>
<div id="panels"></div>

<script>
const procs = [
  {
    id: 'cpu',
    icon: 'ti-cpu',
    title: 'CPU',
    full: 'Central Processing Unit',
    tagline: 'The brain — few, powerful cores for complex sequential logic',
    accentBg: '#E6F1FB', accentText: '#0C447C', accentBorder: '#185FA5', accentMid: '#378ADD',
    tags: [
      {t:'General purpose', bg:'#E6F1FB', c:'#0C447C'},
      {t:'Low latency', bg:'#E6F1FB', c:'#0C447C'},
      {t:'Sequential', bg:'#E6F1FB', c:'#0C447C'},
      {t:'High single-core IPC', bg:'#E6F1FB', c:'#0C447C'},
    ],
    desc: 'CPUs use a small number of highly capable cores — each with its own ALU, FPU, branch predictor, out-of-order engine, and multi-level cache. They excel at complex branching logic, running operating systems, applications, and any task that cannot be easily parallelized.',
    specs: [
      {l:'Cores', v:'4 – 128'},
      {l:'Clock speed', v:'1 – 6 GHz'},
      {l:'Parallelism', v:'Thread-level (4–256 threads)'},
      {l:'L3 Cache', v:'8 – 256 MB'},
      {l:'Best for', v:'OS, apps, branching logic'},
      {l:'Power draw', v:'15 – 400 W'},
      {l:'Architecture', v:'CISC / RISC'},
      {l:'Example', v:'Intel Core i9, AMD Ryzen 9'},
    ],
    drawSVG: drawCPU
  },
  {
    id: 'gpu',
    icon: 'ti-brand-nvidia',
    title: 'GPU',
    full: 'Graphics Processing Unit',
    tagline: 'Thousands of tiny parallel workers — massive throughput',
    accentBg: '#EAF3DE', accentText: '#27500A', accentBorder: '#3B6D11', accentMid: '#639922',
    tags: [
      {t:'Massively parallel', bg:'#EAF3DE', c:'#27500A'},
      {t:'High throughput', bg:'#EAF3DE', c:'#27500A'},
      {t:'SIMT', bg:'#EAF3DE', c:'#27500A'},
      {t:'AI training', bg:'#EAF3DE', c:'#27500A'},
    ],
    desc: 'GPUs pack thousands of smaller shader cores (CUDA cores) into Streaming Multiprocessors. All cores execute the same instruction on different data simultaneously (SIMT). Originally for rendering pixels, they now power deep learning training by accelerating giant matrix multiplications.',
    specs: [
      {l:'CUDA cores', v:'1,000 – 18,000+'},
      {l:'Memory', v:'8 – 80 GB VRAM'},
      {l:'Parallelism', v:'Thousands of threads'},
      {l:'Bandwidth', v:'Up to 3.2 TB/s (HBM3)'},
      {l:'Best for', v:'Graphics, ML training'},
      {l:'Power draw', v:'75 – 700 W'},
      {l:'Architecture', v:'SIMT'},
      {l:'Example', v:'NVIDIA RTX 4090, H100'},
    ],
    drawSVG: drawGPU
  },
  {
    id: 'tpu',
    icon: 'ti-matrix',
    title: 'TPU',
    full: 'Tensor Processing Unit',
    tagline: 'Google\'s ASIC — built for matrix math at scale',
    accentBg: '#FAEEDA', accentText: '#633806', accentBorder: '#854F0B', accentMid: '#BA7517',
    tags: [
      {t:'AI accelerator', bg:'#FAEEDA', c:'#633806'},
      {t:'Systolic array', bg:'#FAEEDA', c:'#633806'},
      {t:'Matrix ops', bg:'#FAEEDA', c:'#633806'},
      {t:'Google-made', bg:'#FAEEDA', c:'#633806'},
    ],
    desc: 'TPUs are custom ASICs designed by Google exclusively for TensorFlow/JAX workloads. Their systolic arrays cascade multiply-accumulate (MAC) units in a grid — weights and activations flow through diagonally so every unit computes every cycle with zero data-movement overhead.',
    specs: [
      {l:'MXU size', v:'128×128 – 256×256'},
      {l:'Memory', v:'16 – 32 GB HBM per chip'},
      {l:'Parallelism', v:'Tensor (matrix) level'},
      {l:'Interconnect', v:'ICI high-speed mesh'},
      {l:'Best for', v:'Transformer training & inference'},
      {l:'Power draw', v:'~200 W per chip'},
      {l:'Architecture', v:'Systolic array + vector'},
      {l:'Example', v:'Google TPU v5e, v5p'},
    ],
    drawSVG: drawTPU
  },
  {
    id: 'npu',
    icon: 'ti-device-mobile',
    title: 'NPU',
    full: 'Neural Processing Unit',
    tagline: 'On-device AI engine — low power, real-time inference',
    accentBg: '#EEEDFE', accentText: '#26215C', accentBorder: '#534AB7', accentMid: '#7F77DD',
    tags: [
      {t:'Edge AI', bg:'#EEEDFE', c:'#26215C'},
      {t:'Ultra low power', bg:'#EEEDFE', c:'#26215C'},
      {t:'Inference', bg:'#EEEDFE', c:'#26215C'},
      {t:'SoC integrated', bg:'#EEEDFE', c:'#26215C'},
    ],
    desc: 'NPUs are fixed-function inference engines embedded inside mobile and laptop SoCs alongside the CPU and GPU. Their MAC arrays process neural network layers efficiently at milliwatts — enabling real-time voice, vision, and on-device LLM features without the cloud.',
    specs: [
      {l:'Performance', v:'10 – 1,000+ TOPS'},
      {l:'Power', v:'0.5 – 30 W'},
      {l:'Parallelism', v:'Layer-wise MAC pipeline'},
      {l:'Memory', v:'Shared LPDDR5 / cache'},
      {l:'Best for', v:'On-device voice, vision, LLM'},
      {l:'Integration', v:'Inside SoC (CPU+GPU+NPU)'},
      {l:'Architecture', v:'MAC array + activation'},
      {l:'Example', v:'Apple Neural Engine, Qualcomm Hexagon'},
    ],
    drawSVG: drawNPU
  }
];

function drawCPU(ac, am) {
  const parts = [];
  parts.push(`<rect class="part" style="--tx:0;--ty:-60px;animation-delay:0s" x="60" y="20" width="560" height="260" rx="16" fill="${ac}" stroke="${am}" stroke-width="1.5" opacity="0.9"/>`);
  const cores = [[80,45],[320,45],[80,165],[320,165]];
  cores.forEach(([x,y],i) => {
    const d = 0.1 + i*0.1;
    const tx = i%2===0 ? -50 : 50;
    parts.push(`
    <g class="part" style="--tx:${tx}px;--ty:-30px;animation-delay:${d}s">
      <rect x="${x}" y="${y}" width="220" height="105" rx="10" fill="${am}" opacity="0.82"/>
      <text font-family="var(--font-sans)" font-size="12" font-weight="500" x="${x+110}" y="${y+20}" text-anchor="middle" fill="${ac}">Core ${i+1}</text>
      <rect x="${x+12}" y="${y+30}" width="56" height="30" rx="5" fill="${ac}" opacity="0.28"/>
      <text font-family="var(--font-sans)" font-size="10" x="${x+40}" y="${y+49}" text-anchor="middle" fill="${ac}">ALU</text>
      <rect x="${x+80}" y="${y+30}" width="56" height="30" rx="5" fill="${ac}" opacity="0.28"/>
      <text font-family="var(--font-sans)" font-size="10" x="${x+108}" y="${y+49}" text-anchor="middle" fill="${ac}">FPU</text>
      <rect x="${x+148}" y="${y+30}" width="56" height="30" rx="5" fill="${ac}" opacity="0.28"/>
      <text font-family="var(--font-sans)" font-size="10" x="${x+176}" y="${y+49}" text-anchor="middle" fill="${ac}">Cache</text>
      <rect x="${x+12}" y="${y+70}" width="196" height="18" rx="4" fill="${ac}" opacity="0.18"/>
      <text font-family="var(--font-sans)" font-size="9" x="${x+110}" y="${y+82}" text-anchor="middle" fill="${ac}">Branch predictor + out-of-order exec</text>
    </g>`);
  });
  parts.push(`<rect class="part" style="--tx:0;--ty:50px;animation-delay:0.5s" x="70" y="287" width="540" height="16" rx="5" fill="${am}" opacity="0.5"/>`);
  parts.push(`<text class="part" style="animation-delay:0.55s" font-family="var(--font-sans)" font-size="10" x="340" y="319" text-anchor="middle" fill="${am}" opacity="0.9">Shared L3 Cache</text>`);
  return `<svg width="100%" viewBox="0 0 680 335" role="img"><title>CPU die diagram</title><desc>4 large cores each with ALU, FPU, cache and branch predictor sharing an L3 cache</desc>${parts.join('')}</svg>`;
}

function drawGPU(ac, am) {
  const parts = [];
  parts.push(`<rect class="part" style="--tx:0;--ty:-60px;animation-delay:0s" x="40" y="20" width="600" height="270" rx="16" fill="${ac}" stroke="${am}" stroke-width="1.5" opacity="0.9"/>`);
  for(let r=0;r<5;r++){
    for(let c=0;c<8;c++){
      const x=60+c*70, y=40+r*48, d=0.05+(r*8+c)*0.015;
      parts.push(`<rect class="part" style="--tx:${(c-3.5)*10}px;--ty:${(r-2)*8}px;animation-delay:${d}s" x="${x}" y="${y}" width="58" height="36" rx="6" fill="${am}" opacity="0.78"/>`);
      parts.push(`<text font-family="var(--font-sans)" font-size="9" x="${x+29}" y="${y+22}" text-anchor="middle" fill="${ac}">SM</text>`);
    }
  }
  parts.push(`<rect class="part" style="--tx:0;--ty:60px;animation-delay:0.95s" x="50" y="292" width="580" height="10" rx="4" fill="${am}" opacity="0.5"/>`);
  parts.push(`<text font-family="var(--font-sans)" font-size="10" x="340" y="317" text-anchor="middle" fill="${am}">Memory bus — GDDR6X / HBM</text>`);
  return `<svg width="100%" viewBox="0 0 680 330" role="img"><title>GPU die diagram</title><desc>40 streaming multiprocessors arranged in a grid sharing a memory bus</desc>${parts.join('')}</svg>`;
}

function drawTPU(ac, am) {
  const parts = [];
  parts.push(`<rect class="part" style="--tx:0;--ty:-60px;animation-delay:0s" x="80" y="20" width="520" height="270" rx="16" fill="${ac}" stroke="${am}" stroke-width="1.5" opacity="0.9"/>`);
  const cols=8, rows=7, cw=46, ch=28, sx=105, sy=42, g=6;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const x=sx+c*(cw+g), y=sy+r*(ch+g), d=0.07+(r*cols+c)*0.01;
      parts.push(`<rect class="part" style="--tx:${(c-3.5)*5}px;--ty:${(r-3)*5}px;animation-delay:${d}s" x="${x}" y="${y}" width="${cw}" height="${ch}" rx="4" fill="${am}" opacity="0.72"/>`);
      parts.push(`<text font-family="var(--font-sans)" font-size="8" x="${x+cw/2}" y="${y+ch/2+3}" text-anchor="middle" fill="${ac}">×+</text>`);
    }
  }
  parts.push(`<line class="part" style="animation-delay:0.85s" x1="90" y1="178" x2="105" y2="178" stroke="${am}" stroke-width="2" marker-end="url(#arr2)"/>`);
  parts.push(`<text font-family="var(--font-sans)" font-size="10" x="88" y="173" text-anchor="end" fill="${am}">Weights</text>`);
  parts.push(`<line class="part" style="animation-delay:0.9s" x1="340" y1="30" x2="340" y2="42" stroke="${am}" stroke-width="2" marker-end="url(#arr2)"/>`);
  parts.push(`<text font-family="var(--font-sans)" font-size="10" x="340" y="27" text-anchor="middle" fill="${am}">Activations</text>`);
  parts.push(`<rect class="part" style="--tx:0;--ty:60px;animation-delay:1s" x="90" y="292" width="500" height="10" rx="4" fill="${am}" opacity="0.5"/>`);
  parts.push(`<text font-family="var(--font-sans)" font-size="10" x="340" y="317" text-anchor="middle" fill="${am}">HBM memory + ICI interconnect</text>`);
  return `<svg width="100%" viewBox="0 0 680 330" role="img">
    <defs><marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
    <title>TPU systolic array diagram</title><desc>8x7 grid of multiply-accumulate units forming the systolic array</desc>
    ${parts.join('')}</svg>`;
}

function drawNPU(ac, am) {
  const parts = [];
  parts.push(`<rect class="part" style="--tx:0;--ty:-60px;animation-delay:0s" x="40" y="15" width="600" height="290" rx="20" fill="${ac}" stroke="${am}" stroke-width="1.5" opacity="0.9"/>`);
  parts.push(`<text font-family="var(--font-sans)" font-size="10" x="340" y="34" text-anchor="middle" fill="${am}" opacity="0.7">System-on-Chip (SoC)</text>`);

  parts.push(`<rect class="part" style="--tx:-60px;--ty:-20px;animation-delay:0.1s" x="60" y="42" width="150" height="90" rx="10" fill="var(--color-background-primary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>`);
  parts.push(`<text font-family="var(--font-sans)" font-size="12" font-weight="500" x="135" y="68" text-anchor="middle" fill="var(--color-text-primary)">CPU</text>`);
  parts.push(`<text font-family="var(--font-sans)" font-size="10" x="135" y="86" text-anchor="middle" fill="var(--color-text-secondary)">4–8 cores</text>`);
  parts.push(`<text font-family="var(--font-sans)" font-size="10" x="135" y="102" text-anchor="middle" fill="var(--color-text-secondary)">General logic</text>`);

  parts.push(`<rect class="part" style="--tx:0;--ty:-20px;animation-delay:0.2s" x="230" y="42" width="160" height="90" rx="10" fill="var(--color-background-primary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>`);
  parts.push(`<text font-family="var(--font-sans)" font-size="12" font-weight="500" x="310" y="68" text-anchor="middle" fill="var(--color-text-primary)">GPU</text>`);
  parts.push(`<text font-family="var(--font-sans)" font-size="10" x="310" y="86" text-anchor="middle" fill="var(--color-text-secondary)">Render + ML</text>`);
  parts.push(`<text font-family="var(--font-sans)" font-size="10" x="310" y="102" text-anchor="middle" fill="var(--color-text-secondary)">Parallel shader</text>`);

  parts.push(`<rect class="part" style="--tx:60px;--ty:-20px;animation-delay:0.3s" x="410" y="30" width="210" height="115" rx="12" fill="${am}" opacity="0.88"/>`);
  parts.push(`<text font-family="var(--font-sans)" font-size="14" font-weight="500" x="515" y="58" text-anchor="middle" fill="${ac}">NPU</text>`);
  parts.push(`<text font-family="var(--font-sans)" font-size="10" x="515" y="74" text-anchor="middle" fill="${ac}">Neural Engine</text>`);
  for(let i=0;i<4;i++){
    const x=425+i*46, d=0.38+i*0.07;
    parts.push(`<rect class="part" style="--tx:0;--ty:-10px;animation-delay:${d}s" x="${x}" y="86" width="38" height="26" rx="5" fill="${ac}" opacity="0.3"/>`);
    parts.push(`<text font-family="var(--font-sans)" font-size="9" x="${x+19}" y="${86+17}" text-anchor="middle" fill="${ac}">×+</text>`);
  }
  parts.push(`<text font-family="var(--font-sans)" font-size="9" x="515" y="132" text-anchor="middle" fill="${ac}">Activation + Quantize</text>`);

  parts.push(`<rect class="part" style="--tx:-30px;--ty:40px;animation-delay:0.55s" x="60" y="155" width="220" height="65" rx="10" fill="var(--color-background-primary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>`);
  parts.push(`<text font-family="var(--font-sans)" font-size="12" font-weight="500" x="170" y="181" text-anchor="middle" fill="var(--color-text-primary)">ISP / DSP</text>`);
  parts.push(`<text font-family="var(--font-sans)" font-size="10" x="170" y="198" text-anchor="middle" fill="var(--color-text-secondary)">Image + signal processing</text>`);

  parts.push(`<rect class="part" style="--tx:30px;--ty:40px;animation-delay:0.65s" x="300" y="155" width="320" height="65" rx="10" fill="var(--color-background-primary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>`);
  parts.push(`<text font-family="var(--font-sans)" font-size="12" font-weight="500" x="460" y="181" text-anchor="middle" fill="var(--color-text-primary)">Unified memory</text>`);
  parts.push(`<text font-family="var(--font-sans)" font-size="10" x="460" y="198" text-anchor="middle" fill="var(--color-text-secondary)">LPDDR5 — shared cache pool</text>`);

  parts.push(`<rect class="part" style="--tx:0;--ty:60px;animation-delay:0.75s" x="50" y="238" width="580" height="8" rx="3" fill="${am}" opacity="0.45"/>`);
  parts.push(`<text font-family="var(--font-sans)" font-size="10" x="340" y="262" text-anchor="middle" fill="${am}">High-bandwidth on-chip interconnect bus</text>`);

  return `<svg width="100%" viewBox="0 0 680 280" role="img"><title>NPU SoC diagram</title><desc>SoC showing CPU, GPU, NPU neural engine, ISP and unified memory connected by an interconnect bus</desc>${parts.join('')}</svg>`;
}

const btnRow = document.getElementById('btnRow');
const panelsEl = document.getElementById('panels');
let active = null;

procs.forEach(p => {
  const btn = document.createElement('button');
  btn.className = 'proc-btn';
  btn.id = 'btn-' + p.id;
  btn.innerHTML = `<i class="ti ${p.icon} btn-icon" aria-hidden="true" style="color:${p.accentBorder}"></i><span class="btn-title">${p.title}</span><span class="btn-sub">${p.full.split(' ').slice(0,2).join(' ')}…</span>`;
  btn.onclick = () => openPanel(p.id);
  btnRow.appendChild(btn);

  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.id = 'panel-' + p.id;

  const tagsHTML = p.tags.map(t => `<span class="tag" style="background:${t.bg};color:${t.c}">${t.t}</span>`).join('');
  const specsHTML = p.specs.map(s => `<div class="spec-card"><div class="sc-label">${s.l}</div><div class="sc-val">${s.v}</div></div>`).join('');

  panel.innerHTML = `
    <div class="panel-header fadein">
      <div class="panel-badge" style="background:${p.accentBg};color:${p.accentBorder}"><i class="ti ${p.icon}" aria-hidden="true"></i></div>
      <div><div class="panel-title">${p.title} — ${p.full}</div><div class="panel-tagline">${p.tagline}</div></div>
    </div>
    <div class="tags fadein" style="animation-delay:0.05s">${tagsHTML}</div>
    <div class="svg-area fadein" style="animation-delay:0.08s" id="svg-${p.id}"></div>
    <p class="desc-text fadein" style="animation-delay:0.1s">${p.desc}</p>
    <div class="specs-grid fadein" style="animation-delay:0.13s">${specsHTML}</div>
  `;
  panelsEl.appendChild(panel);

  document.getElementById(`svg-${p.id}`).innerHTML = p.drawSVG(p.accentBg, p.accentMid);
});

function openPanel(id) {
  const p = procs.find(x => x.id === id);
  document.querySelectorAll('.panel').forEach(el => el.classList.remove('visible'));
  document.querySelectorAll('.proc-btn').forEach(el => { el.classList.remove('active'); el.style.borderColor=''; el.style.color=''; });
  const panel = document.getElementById('panel-' + id);
  const btn = document.getElementById('btn-' + id);
  panel.classList.add('visible');
  btn.classList.add('active');
  btn.style.borderColor = p.accentBorder;
  panel.querySelectorAll('.fadein').forEach((el,i) => {
    el.style.animation = 'none'; el.offsetHeight;
    el.style.animation = '';
  });
  const svgEl = document.getElementById('svg-' + id);
  svgEl.innerHTML = p.drawSVG(p.accentBg, p.accentMid);
}

openPanel('cpu');
</script>
