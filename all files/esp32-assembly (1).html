<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ESP32 DevKit — Interactive Assembly</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #020810;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    font-family: 'Share Tech Mono', monospace;
  }
  .wrap {
    background: #060d1a;
    border-radius: 20px;
    padding: 28px 24px 32px;
    width: 100%;
    max-width: 760px;
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(0,200,255,0.15);
    box-shadow: 0 0 60px rgba(0,100,200,0.15), inset 0 0 40px rgba(0,10,30,0.8);
  }
  .wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(0deg, rgba(0,200,255,0.018) 0px, rgba(0,200,255,0.018) 1px, transparent 1px, transparent 40px),
      repeating-linear-gradient(90deg, rgba(0,200,255,0.018) 0px, rgba(0,200,255,0.018) 1px, transparent 1px, transparent 40px);
    pointer-events: none;
    border-radius: 20px;
  }
  .hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .title { font-family: 'Orbitron', monospace; font-size: 15px; font-weight: 700; color: #00c8ff; letter-spacing: 3px; text-transform: uppercase; }
  .status-bar { font-size: 11px; color: #00c8ff; opacity: 0.55; letter-spacing: 1px; }
  .stage { position: relative; width: 100%; height: 380px; margin-bottom: 22px; }
  .part {
    position: absolute;
    cursor: pointer;
    transition: transform 0.75s cubic-bezier(.34,1.4,.64,1), opacity 0.5s ease, filter 0.2s;
    opacity: 0;
    transform: translateX(var(--ox)) translateY(var(--oy)) scale(0.6);
    filter: drop-shadow(0 0 6px rgba(0,200,255,0.4));
  }
  .part.arrived { opacity: 1; transform: translateX(0) translateY(0) scale(1); }
  .part:hover {
    filter: drop-shadow(0 0 16px rgba(0,220,255,0.95)) brightness(1.25) !important;
    transform: translateX(0) translateY(0) scale(1.05) !important;
    z-index: 20;
  }
  .part svg { display: block; }
  .controls { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .btn-assemble {
    font-family: 'Orbitron', monospace; font-size: 12px; font-weight: 700;
    letter-spacing: 2px; color: #00c8ff; background: transparent;
    border: 1.5px solid #00c8ff; border-radius: 8px; padding: 11px 24px;
    cursor: pointer; transition: background 0.2s, color 0.2s, box-shadow 0.2s;
    text-transform: uppercase;
  }
  .btn-assemble:hover { background: rgba(0,200,255,0.12); box-shadow: 0 0 20px rgba(0,200,255,0.3); }
  .btn-assemble:active { background: rgba(0,200,255,0.25); transform: scale(0.98); }
  .btn-reset {
    font-family: 'Orbitron', monospace; font-size: 11px; letter-spacing: 1px;
    color: rgba(0,200,255,0.5); background: transparent;
    border: 1px solid rgba(0,200,255,0.25); border-radius: 8px; padding: 11px 18px;
    cursor: pointer; transition: all 0.2s; text-transform: uppercase;
  }
  .btn-reset:hover { color: #00c8ff; border-color: rgba(0,200,255,0.6); box-shadow: 0 0 12px rgba(0,200,255,0.15); }
  .progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .progress-label { font-size: 11px; color: rgba(0,200,255,0.5); letter-spacing: 1px; }
  .progress-track { flex: 1; height: 3px; background: rgba(0,200,255,0.1); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #0066aa, #00c8ff); border-radius: 2px; width: 0%; transition: width 0.4s ease; }
  .progress-pct { font-size: 11px; color: #00c8ff; min-width: 40px; text-align: right; }
  .info-panel {
    background: rgba(0,15,35,0.95); border: 1px solid rgba(0,200,255,0.3);
    border-radius: 12px; padding: 18px 20px; min-height: 90px;
    transition: all 0.3s; margin-bottom: 14px;
  }
  .info-panel .part-name { font-family: 'Orbitron', monospace; font-size: 13px; color: #00c8ff; letter-spacing: 2px; margin-bottom: 8px; }
  .info-panel .part-desc { font-size: 12px; color: rgba(180,230,255,0.8); line-height: 1.75; }
  .info-panel .part-stats { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .stat-chip { font-size: 10px; color: rgba(0,200,255,0.75); background: rgba(0,200,255,0.07); border: 1px solid rgba(0,200,255,0.2); border-radius: 4px; padding: 4px 10px; letter-spacing: 1px; }
  .part-list { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .part-dot { width: 11px; height: 11px; border-radius: 50%; background: rgba(0,200,255,0.1); border: 1px solid rgba(0,200,255,0.25); transition: all 0.3s; cursor: default; }
  .part-dot.done { background: #00c8ff; border-color: #00c8ff; box-shadow: 0 0 6px rgba(0,200,255,0.6); }
  .hint { font-size: 11px; color: rgba(0,200,255,0.3); letter-spacing: 1px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="title">ESP32 DevKit — Assembly</div>
    <div class="status-bar" id="status">AWAITING ASSEMBLY</div>
  </div>
  <div class="controls">
    <button class="btn-assemble" onclick="assemble()">⚡ Assemble ESP32</button>
    <button class="btn-reset" onclick="reset()">↺ Reset</button>
  </div>
  <div class="progress-row">
    <span class="progress-label">BUILD</span>
    <div class="progress-track"><div class="progress-fill" id="prog"></div></div>
    <span class="progress-pct" id="progPct">0%</span>
  </div>
  <div class="stage" id="stage"></div>
  <div class="info-panel" id="infoPanel">
    <div class="part-name" id="infoName">— SELECT A PART —</div>
    <div class="part-desc" id="infoDesc">Assemble the board first, then click any glowing part to learn about it.</div>
    <div class="part-stats" id="infoStats"></div>
  </div>
  <div class="part-list" id="partDots"></div>
  <div class="hint" id="hint">▶ Click ASSEMBLE to begin</div>
</div>

<script>
const parts = [

  /* ── 1. PCB BOARD ── */
  {
    id: 'pcb', name: 'PCB Board',
    ox: '0px', oy: '300px', x: 130, y: 20, w: 220, h: 340, delay: 0,
    desc: 'The printed circuit board (PCB) is a 2-layer FR4 fibreglass substrate that connects all ESP32 components with copper traces. Its distinctive teal/green soldermask protects the copper and gives the board its iconic colour.',
    stats: ['Material: FR4', 'Layers: 2', 'Thickness: 1.6mm', 'RoHS compliant'],
    svg: `<svg width="220" height="340" viewBox="0 0 220 340">
      <!-- board body -->
      <rect x="4" y="4" width="212" height="332" rx="8" fill="#0a2a1a" stroke="#1a6a3a" stroke-width="2"/>
      <!-- silk screen grid lines -->
      ${[...Array(8)].map((_,i)=>`<line x1="10" y1="${50+i*36}" x2="210" y2="${50+i*36}" stroke="rgba(0,255,100,0.05)" stroke-width="0.5"/>`).join('')}
      ${[...Array(5)].map((_,i)=>`<line x1="${30+i*38}" y1="10" x2="${30+i*38}" y2="330" stroke="rgba(0,255,100,0.05)" stroke-width="0.5"/>`).join('')}
      <!-- mounting holes -->
      <circle cx="16" cy="16" r="4" fill="none" stroke="rgba(0,200,255,0.3)" stroke-width="1"/>
      <circle cx="204" cy="16" r="4" fill="none" stroke="rgba(0,200,255,0.3)" stroke-width="1"/>
      <circle cx="16" cy="324" r="4" fill="none" stroke="rgba(0,200,255,0.3)" stroke-width="1"/>
      <circle cx="204" cy="324" r="4" fill="none" stroke="rgba(0,200,255,0.3)" stroke-width="1"/>
      <!-- board label -->
      <text x="110" y="318" fill="rgba(0,255,100,0.35)" font-size="9" text-anchor="middle" font-family="'Share Tech Mono',monospace">ESP32 DEVKIT V1</text>
    </svg>`
  },

  /* ── 2. ESP32-WROOM MODULE ── */
  {
    id: 'wroom', name: 'ESP32-WROOM-32 Module',
    ox: '0px', oy: '-280px', x: 155, y: 48, w: 165, h: 128, delay: 300,
    desc: 'The ESP32-WROOM-32 is the main System-on-Module. It houses the dual-core Xtensa LX6 CPU, 4MB flash memory, 520KB SRAM, a PCB trace antenna, and the RF shielding metal can. This single module provides Wi-Fi 802.11 b/g/n and Bluetooth 4.2/BLE.',
    stats: ['CPU: Dual-core 240MHz', 'RAM: 520KB SRAM', 'Flash: 4MB', 'Wi-Fi + BT 4.2'],
    svg: `<svg width="165" height="128" viewBox="0 0 165 128">
      <!-- metal shield can -->
      <rect x="2" y="2" width="161" height="118" rx="5" fill="#1a2a3a" stroke="#4a8aaa" stroke-width="1.5"/>
      <!-- inner chip markings -->
      <rect x="14" y="14" width="137" height="90" rx="3" fill="#0d1e2e" stroke="rgba(74,138,170,0.4)" stroke-width="0.8"/>
      <!-- espressif logo text -->
      <text x="82" y="52" fill="rgba(100,180,220,0.8)" font-size="11" font-weight="bold" text-anchor="middle" font-family="'Share Tech Mono',monospace">ESPRESSIF</text>
      <text x="82" y="68" fill="rgba(100,180,220,0.9)" font-size="10" text-anchor="middle" font-family="'Share Tech Mono',monospace">ESP32-WROOM-32</text>
      <text x="82" y="82" fill="rgba(100,180,220,0.5)" font-size="8" text-anchor="middle" font-family="'Share Tech Mono',monospace">4MB  FCC/CE</text>
      <!-- castellated pads bottom -->
      ${[...Array(9)].map((_,i)=>`<rect x="${10+i*16}" y="116" width="8" height="8" rx="1" fill="#2a4a5a" stroke="rgba(0,200,255,0.4)" stroke-width="0.5"/>`).join('')}
      <!-- castellated pads top -->
      ${[...Array(9)].map((_,i)=>`<rect x="${10+i*16}" y="4" width="8" height="6" rx="1" fill="#2a4a5a" stroke="rgba(0,200,255,0.4)" stroke-width="0.5"/>`).join('')}
      <!-- antenna trace on right -->
      <polyline points="152,20 160,20 160,108 152,108" fill="none" stroke="rgba(0,200,255,0.5)" stroke-width="1.5"/>
      <text x="82" y="110" fill="rgba(0,200,255,0.25)" font-size="7" text-anchor="middle" font-family="'Share Tech Mono',monospace">PCB ANTENNA →</text>
    </svg>`
  },

  /* ── 3. USB / UART CHIP ── */
  {
    id: 'usbchip', name: 'USB-to-UART Bridge (CP2102)',
    ox: '-260px', oy: '0px', x: 155, y: 210, w: 56, h: 38, delay: 600,
    desc: 'The CP2102 or CH340 USB-to-UART bridge converts USB signals from your computer into serial UART signals the ESP32 understands. This chip allows you to program and communicate with the ESP32 over a standard Micro-USB cable without an external programmer.',
    stats: ['IC: CP2102 / CH340', 'Speed: up to 3Mbaud', 'Interface: USB ↔ UART', 'VDD: 3.3V'],
    svg: `<svg width="56" height="38" viewBox="0 0 56 38">
      <rect x="2" y="2" width="52" height="34" rx="3" fill="#1a1a2e" stroke="#6644aa" stroke-width="1.2"/>
      <!-- IC dot marker -->
      <circle cx="8" cy="8" r="2.5" fill="#6644aa" opacity="0.8"/>
      <!-- pin marks left -->
      ${[0,1,2].map(i=>`<rect x="0" y="${8+i*9}" width="4" height="4" rx="1" fill="#4a3080" stroke="rgba(150,100,255,0.5)" stroke-width="0.5"/>`).join('')}
      <!-- pin marks right -->
      ${[0,1,2].map(i=>`<rect x="52" y="${8+i*9}" width="4" height="4" rx="1" fill="#4a3080" stroke="rgba(150,100,255,0.5)" stroke-width="0.5"/>`).join('')}
      <text x="28" y="22" fill="rgba(150,100,255,0.8)" font-size="7" text-anchor="middle" font-family="'Share Tech Mono',monospace">CP2102</text>
    </svg>`
  },

  /* ── 4. MICRO-USB PORT ── */
  {
    id: 'usb', name: 'Micro-USB Port',
    ox: '0px', oy: '-300px', x: 163, y: 288, w: 44, h: 28, delay: 900,
    desc: 'The Micro-USB connector is the power and programming interface. Connect a USB cable to a PC to flash firmware via the CP2102 bridge or to power the board at 5V. The onboard regulator steps this down to 3.3V for the ESP32 chip.',
    stats: ['Connector: Micro-USB B', 'Power: 5V input', 'Data: USB 2.0 FS', 'Max current: 500mA'],
    svg: `<svg width="44" height="28" viewBox="0 0 44 28">
      <rect x="2" y="4" width="40" height="20" rx="3" fill="#2a2a2a" stroke="#888" stroke-width="1.5"/>
      <rect x="6" y="7" width="32" height="14" rx="2" fill="#111" stroke="#555" stroke-width="0.8"/>
      <!-- USB trident pins -->
      <rect x="12" y="9" width="3" height="10" rx="1" fill="#aaa"/>
      <rect x="20" y="9" width="3" height="10" rx="1" fill="#aaa"/>
      <rect x="28" y="9" width="3" height="10" rx="1" fill="#aaa"/>
      <!-- mounting tabs -->
      <rect x="0" y="0" width="6" height="8" rx="1" fill="#1a1a1a" stroke="#666" stroke-width="0.8"/>
      <rect x="38" y="0" width="6" height="8" rx="1" fill="#1a1a1a" stroke="#666" stroke-width="0.8"/>
      <rect x="0" y="20" width="6" height="8" rx="1" fill="#1a1a1a" stroke="#666" stroke-width="0.8"/>
      <rect x="38" y="20" width="6" height="8" rx="1" fill="#1a1a1a" stroke="#666" stroke-width="0.8"/>
    </svg>`
  },

  /* ── 5. VOLTAGE REGULATOR ── */
  {
    id: 'vreg', name: '3.3V Voltage Regulator (AMS1117)',
    ox: '280px', oy: '0px', x: 155, y: 256, w: 46, h: 32, delay: 1100,
    desc: 'The AMS1117-3.3 LDO (Low Dropout) linear voltage regulator converts the 5V USB input down to the 3.3V required by the ESP32 chip and most on-board peripherals. It can supply up to 800mA of current to power external sensors and modules.',
    stats: ['IC: AMS1117-3.3', 'Output: 3.3V ±1%', 'Max current: 800mA', 'Type: LDO linear'],
    svg: `<svg width="46" height="32" viewBox="0 0 46 32">
      <rect x="4" y="2" width="38" height="24" rx="3" fill="#1e1a10" stroke="#aa8800" stroke-width="1.2"/>
      <!-- 3 pins bottom -->
      <rect x="8" y="24" width="6" height="8" rx="1" fill="#887722" stroke="#ccaa00" stroke-width="0.8"/>
      <rect x="20" y="24" width="6" height="8" rx="1" fill="#887722" stroke="#ccaa00" stroke-width="0.8"/>
      <rect x="32" y="24" width="6" height="8" rx="1" fill="#887722" stroke="#ccaa00" stroke-width="0.8"/>
      <text x="23" y="17" fill="rgba(200,160,0,0.8)" font-size="7" text-anchor="middle" font-family="'Share Tech Mono',monospace">AMS1117</text>
      <text x="23" y="26" fill="rgba(200,160,0,0.5)" font-size="6" text-anchor="middle" font-family="'Share Tech Mono',monospace">3.3</text>
    </svg>`
  },

  /* ── 6. GPIO HEADER LEFT ── */
  {
    id: 'gpio_left', name: 'GPIO Header (Left Rail)',
    ox: '-280px', oy: '0px', x: 134, y: 48, w: 22, h: 296, delay: 1300,
    desc: 'The left-side 19-pin female header exposes GPIO pins including power (3.3V, GND), analog inputs (ADC1), touch-sensitive pins, UART TX/RX, and general digital I/O. These are the primary connection points for sensors, LEDs, displays, and other peripherals.',
    stats: ['Pins: 19', 'Pitch: 2.54mm', 'Logic: 3.3V', 'Max per pin: 40mA'],
    svg: `<svg width="22" height="296" viewBox="0 0 22 296">
      <rect x="2" y="2" width="18" height="292" rx="3" fill="#0a1a0a" stroke="#1a5a1a" stroke-width="1"/>
      ${[...Array(19)].map((_,i)=>`
        <rect x="5" y="${8+i*15}" width="12" height="10" rx="1" fill="#1a3a1a" stroke="rgba(0,200,100,0.4)" stroke-width="0.5"/>
        <circle cx="11" cy="${13+i*15}" r="2.5" fill="rgba(0,255,100,0.15)" stroke="rgba(0,200,100,0.5)" stroke-width="0.5"/>
      `).join('')}
    </svg>`
  },

  /* ── 7. GPIO HEADER RIGHT ── */
  {
    id: 'gpio_right', name: 'GPIO Header (Right Rail)',
    ox: '280px', oy: '0px', x: 323, y: 48, w: 22, h: 296, delay: 1350,
    desc: 'The right-side 19-pin female header exposes GPIO pins including the second ADC2 channel, DAC output pins (GPIO25, GPIO26), SPI, I2C, PWM outputs, and additional GND/power rails. Together both headers give access to up to 34 programmable GPIOs.',
    stats: ['Pins: 19', 'Pitch: 2.54mm', 'DAC: GPIO 25/26', 'SPI/I2C/PWM'],
    svg: `<svg width="22" height="296" viewBox="0 0 22 296">
      <rect x="2" y="2" width="18" height="292" rx="3" fill="#0a1a0a" stroke="#1a5a1a" stroke-width="1"/>
      ${[...Array(19)].map((_,i)=>`
        <rect x="5" y="${8+i*15}" width="12" height="10" rx="1" fill="#1a3a1a" stroke="rgba(0,200,100,0.4)" stroke-width="0.5"/>
        <circle cx="11" cy="${13+i*15}" r="2.5" fill="rgba(0,255,100,0.15)" stroke="rgba(0,200,100,0.5)" stroke-width="0.5"/>
      `).join('')}
    </svg>`
  },

  /* ── 8. ENABLE BUTTON ── */
  {
    id: 'en_btn', name: 'EN (Enable / Reset) Button',
    ox: '0px', oy: '-280px', x: 200, y: 250, w: 30, h: 30, delay: 1550,
    desc: 'The EN (Enable) button is the reset button. Pressing it pulls the EN pin LOW, which resets the ESP32 and restarts the firmware from the beginning. It is commonly pressed after uploading new code if the board does not auto-reset, or during boot mode entry.',
    stats: ['Function: Reset (EN)', 'Type: Tactile SMD', 'Active: LOW', 'Debounce: HW'],
    svg: `<svg width="30" height="30" viewBox="0 0 30 30">
      <rect x="2" y="2" width="26" height="26" rx="4" fill="#1a0a0a" stroke="#aa2200" stroke-width="1.5"/>
      <rect x="6" y="6" width="18" height="18" rx="3" fill="#cc3300" stroke="#ff4400" stroke-width="1"/>
      <circle cx="15" cy="15" r="5" fill="#ff5522" stroke="#ff7744" stroke-width="0.8"/>
      <text x="15" y="39" fill="rgba(255,80,0,0.6)" font-size="7" text-anchor="middle" font-family="'Share Tech Mono',monospace">EN</text>
    </svg>`
  },

  /* ── 9. BOOT BUTTON ── */
  {
    id: 'boot_btn', name: 'BOOT Button (GPIO0)',
    ox: '0px', oy: '280px', x: 248, y: 250, w: 30, h: 30, delay: 1600,
    desc: 'The BOOT button is connected to GPIO0. Holding it LOW during power-up or reset forces the ESP32 into bootloader/download mode so new firmware can be flashed over UART. During normal operation it acts as a user-programmable input button.',
    stats: ['GPIO: 0', 'Mode: Boot / Input', 'Active: LOW', 'Pull-up: Internal 45kΩ'],
    svg: `<svg width="30" height="30" viewBox="0 0 30 30">
      <rect x="2" y="2" width="26" height="26" rx="4" fill="#0a0a1a" stroke="#2244aa" stroke-width="1.5"/>
      <rect x="6" y="6" width="18" height="18" rx="3" fill="#1133cc" stroke="#3355ff" stroke-width="1"/>
      <circle cx="15" cy="15" r="5" fill="#2255ff" stroke="#4477ff" stroke-width="0.8"/>
      <text x="15" y="39" fill="rgba(50,100,255,0.6)" font-size="6" text-anchor="middle" font-family="'Share Tech Mono',monospace">BOOT</text>
    </svg>`
  },

  /* ── 10. POWER LED ── */
  {
    id: 'power_led', name: 'Power LED',
    ox: '-280px', oy: '-280px', x: 295, y: 262, w: 16, h: 16, delay: 1800,
    desc: 'A small red SMD LED is connected to the 3.3V rail via a current-limiting resistor. It lights up as soon as power is applied to the board, confirming the voltage regulator is working and the ESP32 is receiving power. Consumes approximately 1–2mA.',
    stats: ['Colour: Red', 'Type: SMD 0402', 'Vf: ~2V', 'Current: ~2mA'],
    svg: `<svg width="16" height="16" viewBox="0 0 16 16">
      <rect x="1" y="1" width="14" height="14" rx="2" fill="#2a0000" stroke="#cc0000" stroke-width="1"/>
      <ellipse cx="8" cy="8" rx="5" ry="5" fill="#ff2200" opacity="0.9"/>
      <ellipse cx="6" cy="6" rx="2" ry="1.5" fill="rgba(255,180,180,0.5)" transform="rotate(-20 6 6)"/>
    </svg>`
  },

  /* ── 11. USER LED (GPIO2) ── */
  {
    id: 'user_led', name: 'User LED (GPIO2)',
    ox: '280px', oy: '-280px', x: 316, y: 262, w: 16, h: 16, delay: 1850,
    desc: 'A blue SMD LED connected to GPIO2 is the classic "blink" LED used in the Hello World of embedded systems. When GPIO2 is driven HIGH in firmware, this LED lights up. It is the first LED most developers use when testing their ESP32 setup.',
    stats: ['GPIO: 2', 'Colour: Blue', 'Type: SMD 0402', 'Active: HIGH'],
    svg: `<svg width="16" height="16" viewBox="0 0 16 16">
      <rect x="1" y="1" width="14" height="14" rx="2" fill="#00002a" stroke="#0044cc" stroke-width="1"/>
      <ellipse cx="8" cy="8" rx="5" ry="5" fill="#1166ff" opacity="0.9"/>
      <ellipse cx="6" cy="6" rx="2" ry="1.5" fill="rgba(180,200,255,0.5)" transform="rotate(-20 6 6)"/>
    </svg>`
  },

  /* ── 12. DECOUPLING CAPACITORS ── */
  {
    id: 'caps', name: 'Decoupling Capacitors',
    ox: '0px', oy: '300px', x: 172, y: 192, w: 60, h: 22, delay: 2050,
    desc: 'Multiple 100nF and 10µF SMD ceramic capacitors are placed close to the power pins of the ESP32 module and the USB chip. They filter out high-frequency noise on the power supply, prevent voltage spikes during Wi-Fi transmission bursts, and stabilise the 3.3V rail.',
    stats: ['Values: 100nF, 10µF', 'Type: MLCC ceramic', 'Voltage: 10V rated', 'Package: 0402/0603'],
    svg: `<svg width="60" height="22" viewBox="0 0 60 22">
      ${[0,1,2].map(i=>`
        <rect x="${4+i*20}" y="3" width="14" height="16" rx="2" fill="#1a1a10" stroke="#887722" stroke-width="1"/>
        <rect x="${7+i*20}" y="6" width="8" height="10" rx="1" fill="#2a2a18" stroke="rgba(200,170,50,0.4)" stroke-width="0.5"/>
        <line x1="${2+i*20}" y1="11" x2="${4+i*20}" y2="11" stroke="#aaa" stroke-width="1.5"/>
        <line x1="${18+i*20}" y1="11" x2="${20+i*20}" y2="11" stroke="#aaa" stroke-width="1.5"/>
      `).join('')}
    </svg>`
  },

  /* ── 13. FLASH MEMORY (inside WROOM) label chip ── */
  {
    id: 'crystal', name: '40MHz Crystal Oscillator',
    ox: '-300px', oy: '300px', x: 172, y: 170, w: 36, h: 20, delay: 2200,
    desc: 'A 40MHz quartz crystal oscillator provides the precise clock reference for the ESP32\'s CPU, RF subsystem, and peripherals. The ESP32 uses this as the base clock, internally multiplying it via PLLs to reach operating frequencies up to 240MHz.',
    stats: ['Frequency: 40MHz', 'Tolerance: ±10ppm', 'Type: SMD HC-49', 'Load cap: 8pF'],
    svg: `<svg width="36" height="20" viewBox="0 0 36 20">
      <rect x="2" y="2" width="32" height="16" rx="4" fill="#2a2218" stroke="#c8a000" stroke-width="1.2"/>
      <rect x="6" y="5" width="24" height="10" rx="2" fill="#1a1810" stroke="rgba(200,160,0,0.4)" stroke-width="0.5"/>
      <line x1="0" y1="10" x2="4" y2="10" stroke="#c8a000" stroke-width="1.2"/>
      <line x1="32" y1="10" x2="36" y2="10" stroke="#c8a000" stroke-width="1.2"/>
      <text x="18" y="13" fill="rgba(200,160,0,0.7)" font-size="6" text-anchor="middle" font-family="'Share Tech Mono',monospace">40MHz</text>
    </svg>`
  }
];

let assembled = false, arrivedCount = 0;

function buildStage() {
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  parts.forEach(p => {
    const div = document.createElement('div');
    div.className = 'part';
    div.id = 'part-' + p.id;
    div.style.cssText = `left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px;--ox:${p.ox};--oy:${p.oy};`;
    div.innerHTML = p.svg;
    div.addEventListener('click', () => showInfo(p));
    stage.appendChild(div);
  });
  buildDots();
}

function buildDots() {
  document.getElementById('partDots').innerHTML = parts.map(p =>
    `<div class="part-dot" id="dot-${p.id}" title="${p.name}"></div>`
  ).join('');
}

function assemble() {
  if (assembled) return;
  assembled = true;
  arrivedCount = 0;
  document.getElementById('status').textContent = 'ASSEMBLING...';
  document.getElementById('hint').textContent = '▶ Click any glowing part to inspect it';
  parts.forEach(p => {
    setTimeout(() => {
      document.getElementById('part-' + p.id).classList.add('arrived');
      arrivedCount++;
      const pct = Math.round((arrivedCount / parts.length) * 100);
      document.getElementById('prog').style.width = pct + '%';
      document.getElementById('progPct').textContent = pct + '%';
      document.getElementById('dot-' + p.id).classList.add('done');
      if (arrivedCount === parts.length) {
        document.getElementById('status').textContent = 'ESP32 ASSEMBLED — CLICK PARTS';
      }
    }, p.delay);
  });
}

function reset() {
  assembled = false;
  arrivedCount = 0;
  document.getElementById('prog').style.width = '0%';
  document.getElementById('progPct').textContent = '0%';
  document.getElementById('status').textContent = 'AWAITING ASSEMBLY';
  document.getElementById('hint').textContent = '▶ Click ASSEMBLE to begin';
  document.getElementById('infoName').textContent = '— SELECT A PART —';
  document.getElementById('infoDesc').textContent = 'Assemble the board first, then click any glowing part to learn about it.';
  document.getElementById('infoStats').innerHTML = '';
  buildStage();
}

function showInfo(p) {
  if (!assembled) return;
  document.getElementById('infoName').textContent = p.name.toUpperCase();
  document.getElementById('infoDesc').textContent = p.desc;
  document.getElementById('infoStats').innerHTML = p.stats.map(s => `<span class="stat-chip">${s}</span>`).join('');
  document.querySelectorAll('.part').forEach(el => el.style.filter = 'drop-shadow(0 0 4px rgba(0,200,255,0.15)) brightness(0.55)');
  document.getElementById('part-' + p.id).style.filter = 'drop-shadow(0 0 22px rgba(0,220,255,1)) brightness(1.5)';
}

buildStage();
</script>
</body>
</html>
