
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  .wrap {
    background: #060d1a;
    border-radius: 16px;
    padding: 24px 20px 28px;
    font-family: 'Share Tech Mono', monospace;
    min-height: 580px;
    position: relative;
    overflow: hidden;
  }

  .wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,200,255,0.015) 0px, rgba(0,200,255,0.015) 1px, transparent 1px, transparent 40px),
                repeating-linear-gradient(90deg, rgba(0,200,255,0.015) 0px, rgba(0,200,255,0.015) 1px, transparent 1px, transparent 40px);
    pointer-events: none;
    border-radius: 16px;
  }

  .hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .title {
    font-family: 'Orbitron', monospace;
    font-size: 14px;
    font-weight: 700;
    color: #00c8ff;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .status-bar {
    font-size: 11px;
    color: #00c8ff;
    opacity: 0.6;
    letter-spacing: 1px;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 320px;
    margin-bottom: 20px;
  }

  .part {
    position: absolute;
    cursor: pointer;
    transition: transform 0.7s cubic-bezier(.34,1.4,.64,1), opacity 0.5s ease, filter 0.2s;
    opacity: 0;
    transform: translateX(var(--ox)) translateY(var(--oy)) scale(0.6);
    filter: drop-shadow(0 0 6px rgba(0,200,255,0.4));
  }

  .part.arrived {
    opacity: 1;
    transform: translateX(0) translateY(0) scale(1);
  }

  .part:hover {
    filter: drop-shadow(0 0 14px rgba(0,220,255,0.9)) brightness(1.2);
    transform: translateX(0) translateY(0) scale(1.05) !important;
    z-index: 20;
  }

  .part svg { display: block; }

  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .btn-assemble {
    font-family: 'Orbitron', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #00c8ff;
    background: transparent;
    border: 1.5px solid #00c8ff;
    border-radius: 6px;
    padding: 10px 22px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    text-transform: uppercase;
  }

  .btn-assemble:hover { background: rgba(0,200,255,0.12); }
  .btn-assemble:active { background: rgba(0,200,255,0.25); }

  .btn-reset {
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    color: rgba(0,200,255,0.5);
    background: transparent;
    border: 1px solid rgba(0,200,255,0.25);
    border-radius: 6px;
    padding: 10px 16px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }

  .btn-reset:hover { color: #00c8ff; border-color: rgba(0,200,255,0.6); }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }

  .progress-label { font-size: 11px; color: rgba(0,200,255,0.5); letter-spacing: 1px; }

  .progress-track {
    flex: 1;
    height: 3px;
    background: rgba(0,200,255,0.12);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: #00c8ff;
    border-radius: 2px;
    width: 0%;
    transition: width 0.4s ease;
  }

  .progress-pct { font-size: 11px; color: #00c8ff; min-width: 36px; text-align: right; }

  .info-panel {
    background: rgba(0,20,40,0.95);
    border: 1px solid rgba(0,200,255,0.35);
    border-radius: 10px;
    padding: 16px 18px;
    min-height: 80px;
    transition: all 0.3s;
  }

  .info-panel .part-name {
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    color: #00c8ff;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  .info-panel .part-desc {
    font-size: 12px;
    color: rgba(180,230,255,0.8);
    line-height: 1.7;
  }

  .info-panel .part-stats {
    display: flex;
    gap: 16px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .stat-chip {
    font-size: 10px;
    color: rgba(0,200,255,0.7);
    background: rgba(0,200,255,0.08);
    border: 1px solid rgba(0,200,255,0.2);
    border-radius: 4px;
    padding: 3px 8px;
    letter-spacing: 1px;
  }

  .part-list {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 14px;
  }

  .part-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: rgba(0,200,255,0.15);
    border: 1px solid rgba(0,200,255,0.3);
    transition: all 0.3s;
    cursor: pointer;
    title: '';
  }

  .part-dot.done { background: #00c8ff; border-color: #00c8ff; }

  .hint { font-size: 11px; color: rgba(0,200,255,0.35); letter-spacing: 1px; margin-top: 8px; }
</style>

<h2 class="sr-only">Interactive electric motor assembly — click assemble to animate parts into place, then click each part to learn about it.</h2>

<div class="wrap">
  <div class="hdr">
    <div class="title">Electric Motor — Assembly</div>
    <div class="status-bar" id="status">AWAITING ASSEMBLY</div>
  </div>

  <div class="controls">
    <button class="btn-assemble" id="btnAssemble" onclick="assemble()">⚡ Assemble Motor</button>
    <button class="btn-reset" onclick="reset()">↺ Reset</button>
  </div>

  <div class="progress-row">
    <span class="progress-label">BUILD</span>
    <div class="progress-track"><div class="progress-fill" id="prog"></div></div>
    <span class="progress-pct" id="progPct">0%</span>
  </div>

  <div class="stage" id="stage"></div>

  <div class="info-panel" id="infoPanel">
    <div class="part-name" id="infoName">— SELECT A PART —</div>
    <div class="part-desc" id="infoDesc">Assemble the motor first, then click any glowing part to learn about it.</div>
    <div class="part-stats" id="infoStats"></div>
  </div>

  <div class="part-list" id="partDots"></div>
  <div class="hint" id="hint">▶ Click ASSEMBLE to begin</div>
</div>

<script>
const parts = [
  {
    id: 'housing',
    name: 'Motor Housing',
    ox: '-220px', oy: '0px',
    x: 30, y: 80, w: 580, h: 220,
    delay: 0,
    desc: 'The outer steel casing that encloses and protects all internal components. Made from cast aluminium or steel, it provides structural rigidity, heat dissipation, and shields the motor from dust and moisture.',
    stats: ['Material: Cast Steel', 'Temp: up to 180°C', 'IP Rating: IP55'],
    svg: `<svg width="580" height="220" viewBox="0 0 580 220">
      <rect x="2" y="30" width="576" height="158" rx="20" fill="#0a1a2e" stroke="#00c8ff" stroke-width="1.5" opacity="0.9"/>
      <rect x="2" y="30" width="576" height="20" rx="10" fill="#0d2240" stroke="#00c8ff" stroke-width="1"/>
      <rect x="2" y="168" width="576" height="20" rx="10" fill="#0d2240" stroke="#00c8ff" stroke-width="1"/>
      <line x1="20" y1="50" x2="20" y2="168" stroke="rgba(0,200,255,0.15)" stroke-width="1"/>
      <line x1="560" y1="50" x2="560" y2="168" stroke="rgba(0,200,255,0.15)" stroke-width="1"/>
      <rect x="0" y="70" width="8" height="80" rx="3" fill="#0d2240" stroke="#00c8ff" stroke-width="1"/>
      <rect x="572" y="70" width="8" height="80" rx="3" fill="#0d2240" stroke="#00c8ff" stroke-width="1"/>
      <text x="290" y="22" fill="rgba(0,200,255,0.4)" font-size="10" text-anchor="middle" font-family="Share Tech Mono">MOTOR HOUSING</text>
    </svg>`
  },
  {
    id: 'stator',
    name: 'Stator (Coils)',
    ox: '0px', oy: '-200px',
    x: 60, y: 100, w: 460, h: 180,
    delay: 300,
    desc: 'The stationary part of the motor. Consists of laminated silicon steel sheets wound with copper coils. When AC or DC current flows through it, it generates a rotating magnetic field that drives the rotor.',
    stats: ['Copper windings', 'Phases: 3-phase AC', 'Insulation: Class F'],
    svg: `<svg width="460" height="180" viewBox="0 0 460 180">
      <rect x="2" y="10" width="456" height="160" rx="14" fill="#061428" stroke="#0066aa" stroke-width="1" opacity="0.7"/>
      ${[...Array(8)].map((_, i) => `
        <rect x="${30 + i*50}" y="20" width="16" height="140" rx="4" fill="#0d2a50" stroke="rgba(0,150,255,0.5)" stroke-width="1"/>
        <rect x="${30 + i*50 + 4}" y="20" width="8" height="140" rx="2" fill="#0a4080"/>
        <rect x="${38 + i*50}" y="20" width="5" height="30" rx="2" fill="#c84800" opacity="0.9"/>
        <rect x="${38 + i*50}" y="60" width="5" height="30" rx="2" fill="#c84800" opacity="0.9"/>
        <rect x="${38 + i*50}" y="100" width="5" height="30" rx="2" fill="#c84800" opacity="0.9"/>
      `).join('')}
      <text x="230" y="170" fill="rgba(0,150,255,0.5)" font-size="10" text-anchor="middle" font-family="Share Tech Mono">STATOR CORE</text>
    </svg>`
  },
  {
    id: 'rotor',
    name: 'Rotor',
    ox: '200px', oy: '-200px',
    x: 140, y: 110, w: 300, h: 160,
    delay: 600,
    desc: 'The rotating component at the heart of the motor. The rotor shaft spins due to electromagnetic force produced by the interaction between stator magnetic field and rotor conductors. Output mechanical power is delivered through its shaft.',
    stats: ['Material: Silicon steel', 'Speed: 1500–3000 RPM', 'Type: Squirrel cage'],
    svg: `<svg width="300" height="160" viewBox="0 0 300 160">
      <ellipse cx="150" cy="80" rx="140" ry="68" fill="#08182e" stroke="#00aaff" stroke-width="1.5"/>
      <ellipse cx="150" cy="80" rx="115" ry="52" fill="#061020" stroke="rgba(0,150,255,0.4)" stroke-width="1"/>
      ${[...Array(12)].map((_, i) => {
        const angle = (i / 12) * Math.PI * 2;
        const x1 = 150 + Math.cos(angle) * 50;
        const y1 = 80 + Math.sin(angle) * 36;
        const x2 = 150 + Math.cos(angle) * 110;
        const y2 = 80 + Math.sin(angle) * 62;
        return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="rgba(0,180,255,0.5)" stroke-width="3"/>`;
      }).join('')}
      <ellipse cx="150" cy="80" rx="48" ry="34" fill="#0a2040" stroke="#00c8ff" stroke-width="1.5"/>
      <line x1="0" y1="80" x2="300" y2="80" stroke="#00c8ff" stroke-width="3" stroke-dasharray="8 4"/>
      <circle cx="150" cy="80" r="10" fill="#00c8ff" opacity="0.8"/>
      <text x="150" y="150" fill="rgba(0,200,255,0.5)" font-size="10" text-anchor="middle" font-family="Share Tech Mono">ROTOR</text>
    </svg>`
  },
  {
    id: 'bearings',
    name: 'Bearings',
    ox: '-200px', oy: '200px',
    x: 44, y: 118, w: 52, h: 52,
    delay: 900,
    desc: 'Precision ball bearings support the rotor shaft at both ends, allowing it to spin freely with minimal friction. Usually sealed and pre-greased. Bearing failure is the most common motor fault, so quality matters.',
    stats: ['Type: Deep groove', 'Lubrication: Grease', 'Life: 20,000+ hrs'],
    svg: `<svg width="52" height="52" viewBox="0 0 52 52">
      <circle cx="26" cy="26" r="24" fill="#08182e" stroke="#00c8ff" stroke-width="1.5"/>
      <circle cx="26" cy="26" r="16" fill="none" stroke="rgba(0,150,255,0.4)" stroke-width="1"/>
      ${[...Array(8)].map((_, i) => {
        const a = (i / 8) * Math.PI * 2;
        const cx = 26 + Math.cos(a) * 16;
        const cy = 26 + Math.sin(a) * 16;
        return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="3" fill="rgba(0,200,255,0.6)" stroke="#00c8ff" stroke-width="0.5"/>`;
      }).join('')}
      <circle cx="26" cy="26" r="7" fill="#0d2240" stroke="#00c8ff" stroke-width="1"/>
      <circle cx="26" cy="26" r="3" fill="#00c8ff" opacity="0.7"/>
    </svg>`
  },
  {
    id: 'bearings2',
    name: 'Bearings (rear)',
    ox: '200px', oy: '200px',
    x: 484, y: 118, w: 52, h: 52,
    delay: 950,
    desc: 'The rear bearing mirrors the front bearing, providing balanced support for the spinning shaft. Both bearings must be perfectly aligned to prevent vibration, noise, and premature wear of the motor.',
    stats: ['Type: Deep groove', 'Lubrication: Grease', 'Life: 20,000+ hrs'],
    svg: `<svg width="52" height="52" viewBox="0 0 52 52">
      <circle cx="26" cy="26" r="24" fill="#08182e" stroke="#00c8ff" stroke-width="1.5"/>
      <circle cx="26" cy="26" r="16" fill="none" stroke="rgba(0,150,255,0.4)" stroke-width="1"/>
      ${[...Array(8)].map((_, i) => {
        const a = (i / 8) * Math.PI * 2;
        const cx = 26 + Math.cos(a) * 16;
        const cy = 26 + Math.sin(a) * 16;
        return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="3" fill="rgba(0,200,255,0.6)" stroke="#00c8ff" stroke-width="0.5"/>`;
      }).join('')}
      <circle cx="26" cy="26" r="7" fill="#0d2240" stroke="#00c8ff" stroke-width="1"/>
      <circle cx="26" cy="26" r="3" fill="#00c8ff" opacity="0.7"/>
    </svg>`
  },
  {
    id: 'shaft',
    name: 'Output Shaft',
    ox: '0px', oy: '250px',
    x: 480, y: 132, w: 120, h: 24,
    delay: 1200,
    desc: 'The rotating steel shaft transmits mechanical energy from the rotor to the load (fan, pump, conveyor, etc.). Machined to tight tolerances with a keyway slot to lock drive pulleys or couplings firmly in place.',
    stats: ['Material: Carbon steel', 'Keyway: 5mm slot', 'Finish: Ground'],
    svg: `<svg width="120" height="24" viewBox="0 0 120 24">
      <rect x="0" y="6" width="115" height="12" rx="4" fill="#1a3a6a" stroke="#00c8ff" stroke-width="1.2"/>
      <rect x="20" y="8" width="80" height="4" rx="2" fill="rgba(0,200,255,0.2)"/>
      <rect x="108" y="4" width="12" height="16" rx="2" fill="#0d2240" stroke="#00c8ff" stroke-width="1"/>
    </svg>`
  },
  {
    id: 'fan',
    name: 'Cooling Fan',
    ox: '0px', oy: '-250px',
    x: 510, y: 88, w: 62, h: 100,
    delay: 1400,
    desc: 'A plastic or aluminium fan mounted on the shaft end draws air over the motor housing fins. This forced convection cooling prevents overheating, which is the leading cause of motor insulation damage and failure.',
    stats: ['Type: Centrifugal', 'Material: Nylon PA', 'Airflow: 0.8 m³/s'],
    svg: `<svg width="62" height="100" viewBox="0 0 62 100">
      ${[...Array(6)].map((_, i) => {
        const a = (i / 6) * Math.PI * 2;
        const x = 31 + Math.cos(a) * 22;
        const y = 50 + Math.sin(a) * 30;
        return `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="8" ry="14" fill="#0a2a50" stroke="rgba(0,200,255,0.5)" stroke-width="1" transform="rotate(${(i/6)*360} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
      }).join('')}
      <circle cx="31" cy="50" r="10" fill="#0d2240" stroke="#00c8ff" stroke-width="1.5"/>
      <circle cx="31" cy="50" r="4" fill="#00c8ff" opacity="0.7"/>
    </svg>`
  },
  {
    id: 'endcap',
    name: 'End Caps',
    ox: '-250px', oy: '0px',
    x: 2, y: 82, w: 36, h: 195,
    delay: 1600,
    desc: 'Pressed steel or cast aluminium end shields (front and rear) close the motor housing and hold the bearings in precise alignment. Ventilation slots or a grill allow cooling air to circulate through the motor.',
    stats: ['Material: Die-cast Al', 'Tolerance: ±0.02mm', 'Mount: Flange/foot'],
    svg: `<svg width="36" height="195" viewBox="0 0 36 195">
      <rect x="2" y="2" width="32" height="191" rx="10" fill="#0a1e38" stroke="#00c8ff" stroke-width="1.5"/>
      ${[0,1,2,3,4].map(i => `<rect x="8" y="${30 + i*30}" width="20" height="8" rx="2" fill="rgba(0,100,200,0.2)" stroke="rgba(0,200,255,0.3)" stroke-width="0.5"/>`).join('')}
      <circle cx="18" cy="98" r="10" fill="#061428" stroke="#00c8ff" stroke-width="1"/>
      <circle cx="18" cy="98" r="5" fill="rgba(0,200,255,0.3)"/>
    </svg>`
  },
  {
    id: 'endcap2',
    name: 'End Cap (rear)',
    ox: '250px', oy: '0px',
    x: 543, y: 82, w: 36, h: 195,
    delay: 1650,
    desc: 'The rear end cap houses the rear bearing and often the terminal box connection point. It must be perfectly parallel to the front end cap so the shaft runs true without any wobble or eccentricity.',
    stats: ['Material: Die-cast Al', 'Tolerance: ±0.02mm', 'Terminal box: T1-T6'],
    svg: `<svg width="36" height="195" viewBox="0 0 36 195">
      <rect x="2" y="2" width="32" height="191" rx="10" fill="#0a1e38" stroke="#00c8ff" stroke-width="1.5"/>
      ${[0,1,2,3,4].map(i => `<rect x="8" y="${30 + i*30}" width="20" height="8" rx="2" fill="rgba(0,100,200,0.2)" stroke="rgba(0,200,255,0.3)" stroke-width="0.5"/>`).join('')}
      <circle cx="18" cy="98" r="10" fill="#061428" stroke="#00c8ff" stroke-width="1"/>
      <circle cx="18" cy="98" r="5" fill="rgba(0,200,255,0.3)"/>
    </svg>`
  },
  {
    id: 'terminals',
    name: 'Terminal Box',
    ox: '0px', oy: '250px',
    x: 220, y: 30, w: 140, h: 55,
    delay: 1900,
    desc: 'The terminal box is the electrical connection point where the power supply wires connect to the motor windings. Terminals are labeled T1–T6. The motor can be wired in star (Y) or delta (Δ) configuration depending on voltage.',
    stats: ['Terminals: T1–T6', 'Config: Star / Delta', 'IP: IP55 sealed'],
    svg: `<svg width="140" height="55" viewBox="0 0 140 55">
      <rect x="2" y="2" width="136" height="51" rx="6" fill="#0a1e38" stroke="#00ff88" stroke-width="1.5"/>
      <rect x="10" y="10" width="120" height="30" rx="4" fill="#061428" stroke="rgba(0,255,136,0.3)" stroke-width="0.5"/>
      ${['T1','T2','T3','T4','T5','T6'].map((t, i) => `
        <circle cx="${18 + i*20}" cy="25" r="6" fill="#0d2240" stroke="#00ff88" stroke-width="1"/>
        <text x="${18 + i*20}" y="29" fill="#00ff88" font-size="7" text-anchor="middle" font-family="Share Tech Mono">${t}</text>
      `).join('')}
      <text x="70" y="48" fill="rgba(0,255,136,0.5)" font-size="9" text-anchor="middle" font-family="Share Tech Mono">TERMINAL BOX</text>
    </svg>`
  }
];

let assembled = false;
let arrivedCount = 0;

function buildStage() {
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  parts.forEach(p => {
    const div = document.createElement('div');
    div.className = 'part';
    div.id = 'part-' + p.id;
    div.style.cssText = `left:${p.x}px; top:${p.y}px; width:${p.w}px; height:${p.h}px; --ox:${p.ox}; --oy:${p.oy};`;
    div.innerHTML = p.svg;
    div.addEventListener('click', () => showInfo(p));
    stage.appendChild(div);
  });
  buildDots();
}

function buildDots() {
  const el = document.getElementById('partDots');
  el.innerHTML = parts.map(p => `<div class="part-dot" id="dot-${p.id}" title="${p.name}"></div>`).join('');
}

function assemble() {
  if (assembled) return;
  assembled = true;
  arrivedCount = 0;
  document.getElementById('status').textContent = 'ASSEMBLING...';
  document.getElementById('hint').textContent = '▶ Click any glowing part to inspect it';

  parts.forEach((p, idx) => {
    setTimeout(() => {
      const el = document.getElementById('part-' + p.id);
      el.classList.add('arrived');
      arrivedCount++;
      const pct = Math.round((arrivedCount / parts.length) * 100);
      document.getElementById('prog').style.width = pct + '%';
      document.getElementById('progPct').textContent = pct + '%';
      document.getElementById('dot-' + p.id).classList.add('done');
      if (arrivedCount === parts.length) {
        document.getElementById('status').textContent = 'MOTOR ASSEMBLED — CLICK PARTS';
      }
    }, p.delay);
  });
}

function reset() {
  assembled = false;
  arrivedCount = 0;
  document.getElementById('prog').style.width = '0%';
  document.getElementById('progPct').textContent = '0%';
  document.getElementById('status').textContent = 'AWAITING ASSEMBLY';
  document.getElementById('hint').textContent = '▶ Click ASSEMBLE to begin';
  document.getElementById('infoName').textContent = '— SELECT A PART —';
  document.getElementById('infoDesc').textContent = 'Assemble the motor first, then click any glowing part to learn about it.';
  document.getElementById('infoStats').innerHTML = '';
  buildStage();
}

function showInfo(p) {
  if (!assembled) return;
  document.getElementById('infoName').textContent = p.name.toUpperCase();
  document.getElementById('infoDesc').textContent = p.desc;
  document.getElementById('infoStats').innerHTML = p.stats.map(s => `<span class="stat-chip">${s}</span>`).join('');
  document.querySelectorAll('.part').forEach(el => el.style.filter = 'drop-shadow(0 0 4px rgba(0,200,255,0.2)) brightness(0.7)');
  document.getElementById('part-' + p.id).style.filter = 'drop-shadow(0 0 20px rgba(0,220,255,1)) brightness(1.4)';
}

buildStage();
</script>
